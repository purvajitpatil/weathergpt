version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# WeatherGPT — Production Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   Development:  docker compose up
#   Production:   WEATHERGPT_DEMO_MODE=off docker compose -f docker-compose.yml up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── WeatherGPT Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql://weathergpt:${POSTGRES_PASSWORD:-weathergpt}@postgres:5432/weathergpt
      - REDIS_URL=redis://redis:6379
      - ML_INFERENCE_URL=http://ml-inference:8001
      - ML_MODEL_VERSION=${ML_MODEL_VERSION:-xgb-rain-v1.2}
      - WEATHERGPT_DEMO_MODE=${WEATHERGPT_DEMO_MODE:-auto}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── ML Inference Service (Python FastAPI + XGBoost) ──────────────────────────
  ml-inference:
    build:
      context: ./ml
      dockerfile: Dockerfile.ml
    ports:
      - "${ML_PORT:-8001}:8001"
    environment:
      - MODEL_PATH=/app/models/rain_risk_model.pkl
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - ML_API_KEY=${ML_API_KEY:-}
    volumes:
      - ml-models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Background Worker (alert ingestion) ─────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "scripts/worker.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://weathergpt:${POSTGRES_PASSWORD:-weathergpt}@postgres:5432/weathergpt
      - REDIS_URL=redis://redis:6379
      - WEATHERGPT_DEMO_MODE=${WEATHERGPT_DEMO_MODE:-auto}
      - WORKER_INGEST_INTERVAL_MS=${WORKER_INGEST_INTERVAL_MS:-300000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weathergpt}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt -d weathergpt"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  pgdata:
  ml-models:
