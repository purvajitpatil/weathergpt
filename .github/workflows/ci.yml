name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint, Typecheck, Tests ───────────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: weathergpt/package-lock.json

      - name: Install dependencies
        working-directory: weathergpt
        run: npm ci

      - name: Typecheck
        working-directory: weathergpt
        run: npm run lint

      - name: Run unit tests
        working-directory: weathergpt
        run: npm test

      - name: Build frontend + backend
        working-directory: weathergpt
        run: npm run build
        env:
          NODE_ENV: production

  # ── Security Checks ────────────────────────────────────────────────────────
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets in committed files
        run: |
          # Ensure no .env files are committed
          if [ -f weathergpt/.env ]; then echo "ERROR: .env file found in repo"; exit 1; fi
          # Ensure no API keys in source (excluding test fixtures and .env.example)
          if grep -r "sk-" --include="*.ts" --include="*.js" --include="*.json" weathergpt/ 2>/dev/null | grep -v node_modules | grep -v ".env.example" | grep -v "MY_GEMINI_API_KEY"; then
            echo "WARNING: Possible API key found in source"
          fi
          echo "Security checks passed"

      - name: Check no secrets in Docker configs
        run: |
          if grep -i "password\|secret\|api_key\|token" weathergpt/docker-compose.yml 2>/dev/null | grep -v '\${' | grep -v '^\s*#'; then
            echo "WARNING: Possible hardcoded secret in docker-compose.yml"
          fi

  # ── Docker Build ────────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v5
        with:
          context: weathergpt
          file: weathergpt/Dockerfile
          push: false
          tags: weathergpt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML inference image
        uses: docker/build-push-action@v5
        with:
          context: weathergpt/ml
          file: weathergpt/ml/Dockerfile.ml
          push: false
          tags: weathergpt-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Compose config
        run: |
          cd weathergpt
          docker compose config --quiet

  # ── Summary ─────────────────────────────────────────────────────────────────
  ci-summary:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-check]
    if: always()
    steps:
      - name: Report CI status
        run: |
          echo "=== CI Summary ==="
          echo "Lint & Test: ${{ needs.lint-and-test.result }}"
          echo "Security:    ${{ needs.security-check.result }}"
          if [ "${{ needs.lint-and-test.result }}" != "success" ] || [ "${{ needs.security-check.result }}" != "success" ]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
